<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hi, I'm Shelo ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  margin: 0;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  min-height: 100vh;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  overflow-y: auto;
  position: relative;
  padding: 10px;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 20% 50%, rgba(255,200,220,0.1) 0%, transparent 50%),
              radial-gradient(circle at 80% 80%, rgba(255,150,180,0.1) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.emoji-background {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.emoji-item {
  position: absolute;
  font-size: 1.8rem;
  opacity: 0.4;
  animation: float 6s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-20px) rotate(10deg); }
}

.falling-hearts {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}

.heart {
  position: absolute;
  font-size: 1.5rem;
  animation: fall linear forwards;
  filter: drop-shadow(0 0 2px rgba(255, 79, 122, 0.6));
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
  }
}

.container {
  width: 95%;
  max-width: 600px;
  background: rgba(255, 255, 255, 0.95);
  padding: 25px 20px;
  border-radius: 25px;
  box-shadow: 0 20px 60px rgba(255, 79, 122, 0.3),
              0 0 40px rgba(255, 200, 220, 0.2);
  text-align: center;
  animation: pop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  z-index: 2;
  backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.5);
  min-height: auto;
  margin: auto 10px;
}

@keyframes pop {
  from { 
    transform: scale(0.5) rotate(-5deg); 
    opacity: 0; 
  }
  to { 
    transform: scale(1) rotate(0deg); 
    opacity: 1; 
  }
}

h1 {
  margin-bottom: 12px;
  margin-top: 0;
  color: #ff4f7a;
  font-size: 1.8rem;
  animation: slideDown 0.8s ease;
  text-shadow: 0 2px 4px rgba(255, 79, 122, 0.2);
  line-height: 1.3;
}

@keyframes slideDown {
  from {
    transform: translateY(-20px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

p {
  font-size: 16px;
  line-height: 1.5;
  color: #333;
  animation: fadeIn 0.8s ease;
  margin: 12px 0;
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

.buttons {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
}

button {
  padding: 14px 20px;
  border: none;
  border-radius: 50px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  box-shadow: 0 4px 15px rgba(255, 79, 122, 0.2);
  position: relative;
  overflow: hidden;
  min-height: 50px;
  width: 100%;
}

button::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  transform: translate(-50%, -50%);
  transition: width 0.6s, height 0.6s;
}

button:active::before {
  width: 300px;
  height: 300px;
}

.yes {
  background: linear-gradient(135deg, #ff4f7a, #ff7eb3);
  color: white;
  font-size: 15px;
}

.yes:hover {
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 8px 25px rgba(255, 79, 122, 0.4);
}

.no {
  background: linear-gradient(135deg, #f0f0f0, #e8e8e8);
  color: #333;
}

.no:hover {
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
}

button:active {
  transform: translateY(-1px) scale(0.98);
}

.shake {
  animation: shake 0.5s;
}

@keyframes shake {
  0%, 100% { transform: translateX(0) rotate(0deg); }
  25% { transform: translateX(-8px) rotate(-1deg); }
  50% { transform: translateX(8px) rotate(1deg); }
  75% { transform: translateX(-8px) rotate(-1deg); }
}

.small {
  font-size: 13px;
  color: #999;
  margin-top: 15px;
  font-style: italic;
}

.bounce {
  animation: bounce 0.6s;
}

@keyframes bounce {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.pulse {
  animation: pulse 1s ease-in-out;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

/* Confetti */
.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  background: #ff4f7a;
  animation: confettiFall 3s ease-in forwards;
  pointer-events: none;
}

@keyframes confettiFall {
  to {
    transform: translateY(100vh) rotate(720deg);
    opacity: 0;
  }
}

/* Sparkle */
.sparkle {
  position: absolute;
  pointer-events: none;
}

@keyframes sparkleGlow {
  0%, 100% { opacity: 0; }
  50% { opacity: 1; }
}

b {
  color: #ff4f7a;
  font-weight: 700;
}

/* Mobile Optimization */
@media (max-width: 600px) {
  body {
    padding: 10px 0;
    min-height: 100vh;
  }

  .container {
    width: 96%;
    max-width: 95vw;
    padding: 22px 18px;
    border-radius: 20px;
    margin: 15px auto;
  }

  h1 {
    font-size: 1.6rem;
    margin-bottom: 10px;
    margin-top: 5px;
  }

  p {
    font-size: 15px;
    line-height: 1.4;
    margin: 10px 0;
  }

  .buttons {
    margin-top: 18px;
    gap: 9px;
  }

  button {
    padding: 13px 18px;
    font-size: 14px;
    min-height: 48px;
    border-radius: 45px;
  }

  .emoji-item {
    font-size: 1.5rem;
  }

  .heart {
    font-size: 1.3rem;
  }

  .small {
    font-size: 12px;
    margin-top: 12px;
  }

  .yes:hover,
  .no:hover {
    transform: translateY(-2px) scale(1.03);
  }
}

@media (max-width: 480px) {
  body {
    padding: 8px 0;
  }

  .container {
    width: 97%;
    padding: 20px 16px;
    border-radius: 18px;
  }

  h1 {
    font-size: 1.4rem;
    margin-bottom: 8px;
  }

  p {
    font-size: 14px;
    line-height: 1.4;
    margin: 8px 0;
  }

  .buttons {
    margin-top: 16px;
    gap: 8px;
  }

  button {
    padding: 12px 16px;
    font-size: 13px;
    min-height: 46px;
    letter-spacing: 0.3px;
  }

  .yes {
    font-size: 13px;
  }

  .emoji-item {
    font-size: 1.3rem;
  }

  .heart {
    font-size: 1.2rem;
  }

  .small {
    font-size: 11px;
    margin-top: 10px;
  }

  body::before {
    background: radial-gradient(circle at 20% 50%, rgba(255,200,220,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255,150,180,0.08) 0%, transparent 50%);
  }
}

@media (max-width: 360px) {
  .container {
    padding: 18px 14px;
  }

  h1 {
    font-size: 1.3rem;
    margin-bottom: 7px;
  }

  p {
    font-size: 13px;
    margin: 7px 0;
  }

  button {
    padding: 11px 14px;
    font-size: 12px;
    min-height: 44px;
  }
}
</style>
</head>

<body>

<div class="emoji-background" id="emojiBackground"></div>
<div class="falling-hearts" id="fallingHearts"></div>
<div class="container" id="app"></div>

<script>
const app = document.getElementById("app");
const emojiBackground = document.getElementById("emojiBackground");
const fallingHeartsContainer = document.getElementById("fallingHearts");

let currentEmojis = ['💕', '❤️', '💖', '💗'];
let currentTheme = 'love';

// Create falling hearts
function createHeart() {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.textContent = '❤️';
  heart.style.left = Math.random() * 100 + '%';
  heart.style.animationDuration = (2 + Math.random() * 2) + 's';
  heart.style.opacity = 0.4 + Math.random() * 0.4;
  fallingHeartsContainer.appendChild(heart);
  
  setTimeout(() => heart.remove(), 4000);
}

// Create continuous falling hearts
let heartInterval = setInterval(createHeart, 300);

// Update emoji background
function updateEmojiBackground(emojis = currentEmojis) {
  emojiBackground.innerHTML = '';
  const count = 15;
  
  for (let i = 0; i < count; i++) {
    const emoji = document.createElement('div');
    emoji.className = 'emoji-item';
    emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    emoji.style.left = Math.random() * 100 + '%';
    emoji.style.top = Math.random() * 100 + '%';
    emoji.style.animationDelay = Math.random() * 3 + 's';
    emoji.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
    emojiBackground.appendChild(emoji);
  }
}

// Create confetti
function createConfetti() {
  for (let i = 0; i < 30; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = Math.random() * 100 + '%';
    confetti.style.top = -10 + 'px';
    confetti.style.background = ['#ff4f7a', '#ff7eb3', '#ff6b9d', '#c2185b'][Math.floor(Math.random() * 4)];
    confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
    confetti.style.animationDelay = Math.random() * 0.5 + 's';
    app.appendChild(confetti);
    
    setTimeout(() => confetti.remove(), 3000);
  }
}

// Trigger happy reactions
function triggerHappyReaction() {
  currentTheme = 'love';
  updateEmojiBackground(['💕', '❤️', '💖', '💗', '💘', '✨']);
  createConfetti();
  app.classList.add('bounce');
  setTimeout(() => app.classList.remove('bounce'), 600);
}

// Trigger sad/rejected reactions
function triggerSadReaction() {
  currentTheme = 'sad';
  updateEmojiBackground(['😒', '🙄', '😑', '😐', '💔']);
  app.classList.add('shake');
  setTimeout(() => app.classList.remove('shake'), 500);
}

// Trigger skeptical reactions
function triggerSkepticalReaction() {
  currentTheme = 'skeptical';
  updateEmojiBackground(['😏', '🙄', '😒', '😈', '😌']);
  app.classList.add('pulse');
  setTimeout(() => app.classList.remove('pulse'), 1000);
}

function page1() {
  currentTheme = 'love';
  updateEmojiBackground(['👋', '💕', '😌', '❤️']);
  app.innerHTML = `
    <h1>Hi, I'm Shelo 👋</h1>
    <p>Nice to meet you 😌</p>
    <div class="buttons">
      <button class="yes" onclick="page2()">❤️ Nice to meet you</button>
      <button class="no" onclick="ignore()">👋 Ignore</button>
    </div>
  `;
}

function ignore() {
  triggerSadReaction();
  app.innerHTML = `
    <h1>Excuse me 😒</h1>
    <p>I said <b>Nice to meet you</b></p>
    <div class="buttons">
      <button class="yes" onclick="page2()">Fine 🙄</button>
    </div>
  `;
}

function page2() {
  triggerHappyReaction();
  app.innerHTML = `
    <h1>Is this you? 👀</h1>
    <p>I saw you 3 years ago and had a crush on you for a very long time.<br>
    I wanted to confess some things…</p>
    <div class="buttons">
      <button class="yes" onclick="page3()">💭 What's it?</button>
      <button class="no" onclick="notInterested()">💔 Not interested</button>
    </div>
  `;
}

function notInterested() {
  triggerSkepticalReaction();
  app.innerHTML = `
    <h1>Too bad 😌</h1>
    <p>You are hearing it anyway.</p>
    <div class="buttons">
      <button class="yes" onclick="page3()">Continue</button>
    </div>
  `;
}

function page3() {
  triggerHappyReaction();
  app.innerHTML = `
    <h1>Listen ❤️</h1>
    <p>As you know, I'm a very busy person according to you.<br>
    But there is always time for love.<br><br>
    You know I love you, right? 😏</p>
    <div class="buttons">
      <button class="yes" onclick="page4()">💕 I loveee youuuu sooo muchhh more</button>
      <button class="no" onclick="denyLove()">No, I don't</button>
    </div>
  `;
}

function denyLove() {
  triggerSkepticalReaction();
  app.classList.add("shake");
  app.innerHTML = `
    <h1>Yeah right 🙄</h1>
    <p><b>Bitch, I know you do</b><br>
    so just shut the fuck up 😌</p>
    <div class="buttons">
      <button class="yes" onclick="page4()">Move on</button>
    </div>
  `;
  setTimeout(()=>app.classList.remove("shake"), 500);
}

function page4() {
  triggerHappyReaction();
  app.innerHTML = `
    <h1>💘 Will You Be My Valentine? 💘</h1>
    <p>Love is temporary, but me annoying you is permanent 😌</p>
    <div class="buttons">
      <button class="yes" onclick="congrats()">Yes ❤️</button>
      <button class="no" onclick="sure1()">No 💔</button>
    </div>
  `;
}

function sure1() {
  triggerSadReaction();
  app.innerHTML = `
    <h1>Are you sure? 😐</h1>
    <div class="buttons">
      <button class="no" onclick="sure2()">Yes</button>
    </div>
  `;
}

function sure2() {
  triggerSadReaction();
  app.innerHTML = `
    <h1>100% sure? 😑</h1>
    <div class="buttons">
      <button class="no" onclick="forced()">Yes</button>
    </div>
  `;
}

function forced() {
  triggerSkepticalReaction();
  app.innerHTML = `
    <h1>No choice 😈</h1>
    <p><b>Bitch, you don't have any option.</b><br>
    This wasn't a request, it was an order.</p>
    <div class="buttons">
      <button class="yes" onclick="congrats()">Reject</button>
    </div>
  `;
}

function congrats() {
  triggerHappyReaction();
  currentTheme = 'celebration';
  updateEmojiBackground(['🎉', '🎊', '💕', '❤️', '💖', '✨', '🎁', '💘']);
  
  app.innerHTML = `
    <h1>🎉 Congratulations 🎉</h1>
    <p>
      Thank you for choosing me as your Valentine 💖<br><br>
      It's a great pleasure to be with you.<br>
      Please pay the bill for the date because<br>
      I spent all my budget asking you out 😌<br><br>
      Much loveeee ❤️<br>
      See you soon 😉
    </p>
    <p class="small">Happy Valentine's Day 💕</p>
  `;
  
  // Extra celebration
  for (let i = 0; i < 5; i++) {
    setTimeout(createConfetti, i * 200);
  }
}

// Initialize
page1();
</script>

</body>
</html>
